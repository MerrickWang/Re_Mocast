# 超参搜索空间（论文使用 NNI，公开材料未给出搜索空间 -> 风险 R1/R3/R7）
# 该文件可直接映射为 NNI 的 search_space.json，也可被 `mocast.tools.sweep` 用于随机搜索。
# 键为配置点号路径，值为候选列表。
model.pmm.patch_size: [2, 4, 8]
model.pmm.patch_stride: [null, 2]
model.pmm.window: [3, 5]
model.pmm.heads: [2, 4, 8]
model.pmm.attn_dim: [32, 64, 128]
model.pmm.attn_scale: [sqrt, d]
model.pmm.potential.kernel: [central, sobel]
model.pmm.potential.hidden: [32, 64, 96]
model.pmm.wavelet.basis: [haar, db2]
model.pmm.wavelet.ll_mode: [zero, keep, learnable]
model.pmm.wavelet.enhance: [sigmoid, softplus, residual]
model.pmm.pyramid.kernels: [[3, 5, 7], [5, 9, 13], [3, 7, 15]]
model.msm.num_experts: [1, 2, 3, 4]
model.msm.kernels: [[3, 5, 7], [5, 9, 13]]
model.msm.dilations: [[1, 1, 1], [1, 2, 3]]
model.temporal.embed_dim: [32, 64, 96]
model.prediction.mode: [oneshot, autoregressive]
train.optimizer.lr: [5.0e-5, 1.0e-4, 2.0e-4]
train.optimizer.weight_decay: [0.0, 1.0e-2, 1.0e-1]
train.batch_size: [4, 6, 8]
loss.lambda_motion: [0.0, 0.005, 0.01, 0.02, 0.04]
