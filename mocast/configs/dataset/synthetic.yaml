# Synthetic advected-blob dataset: known velocity field for mechanism tests
# (section 8.2 UT-xx) and for the L1 dry-run acceptance (section 9).
dataset:
  name: synthetic
  n_sequences: 32
  frames_per_sequence: 25                  # 5 in + 20 out
  height: 128
  width: 128
  gen_seed: 1234
  cache_sequences: null                    # 设为目录可把合成数据落盘
  n_blobs: 12
  source_strength: 0.08                    # 源汇强度（生成/消散）
  velocity_drift: 0.35                     # 速度随时间缓慢变化 -> 运动趋势可学习
  velocity_period: 12.0

  input_len: 5
  target_len: 20
  stride: 5
  resize: null
  resize_mode: area
  crop: {mode: none}
  sanitize: {fill: 0.0, clip: null}
  normalization: {mode: minmax, vmin: 0.0, vmax: 1.0}
  thresholds: [0.2, 0.4, 0.6, 0.8]
  motion_mask_threshold: 0.2
  filter:
    enabled: true
    min_intensity: 0.2
    min_rain_pixels: 8
    min_rain_frames: 1
    max_empty_ratio: 1.0
  split_config:
    mode: ratio
    ratios: {train: 0.7, val: 0.15, test: 0.15}
    seed: 2026
  cache_index: true
  cache_dir: outputs/cache
  return_physical: true
